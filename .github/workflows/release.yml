# Packages the plugin with the Plugin SDK and publishes it as a GitHub release. Then run
# "Add plugin release" in arrumo-plugin-registry so Arrumo can install and bundle it.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, such as 1.0.0"
        required: true
concurrency: release
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      PLUGIN: higgsfield
    steps:
      - name: Check the version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Give a version such as 1.0.0"; exit 1
          fi
      - uses: actions/checkout@v7
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: aidevs-pt/arrumo-plugin-sdk
          ref: 74963b7dc919162fc5f24019905275e35fa69c38
          path: plugin-sdk
          token: ${{ secrets.ARRUMO_REPOS_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r plugin-sdk/motion-worker-requirements.txt
      - name: Package
        run: python plugin-sdk/tools/package_plugin.py plugin "$RUNNER_TEMP/$PLUGIN-$VERSION.zip" --include LICENSE --include README.md --include video-generation.json --include image-generation.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="$RUNNER_TEMP/$PLUGIN-$VERSION.zip"
          gh release create "v$VERSION" "$package" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes
          {
            echo "### Published $PLUGIN $VERSION"
            echo
            echo "SHA-256: \`$(sha256sum "$package" | cut -d' ' -f1)\`"
            echo
            echo "Next: run **Add plugin release** in arrumo-plugin-registry with plugin \`$PLUGIN\` and version \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
